:root{--f1:11px;--f15:22px;--f2:22px;--f3:33px;--y:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed;font-weight:normal}
html,body{margin:0;height:100%;background:#07050f;color:#fff;font:var(--f15)/1.2 Modula,monospace;overflow:hidden;touch-action:manipulation}
html{font-size:var(--f15)}
canvas{image-rendering:pixelated;display:block}
b{color:var(--y)}
small,.s{font-size:var(--f1);color:#b9b0e8;display:block;line-height:1.25}
.l{font-size:var(--f2);line-height:1.1}
.h1{font-size:var(--f3);color:var(--y);text-shadow:3px 3px #c0392b;margin:.2rem 0;line-height:1.05}
button{font:inherit;color:#1a1030;background:var(--y);border:3px solid #000;box-shadow:0 4px 0 #8a6a00,inset 0 3px 0 rgba(255,255,255,.4);padding:.4rem .7rem;margin:.15rem;border-radius:6px;cursor:pointer;line-height:1.1;max-width:100%;overflow:hidden;white-space:normal;overflow-wrap:anywhere;text-align:center}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a00}
button.dis{opacity:.45}button.on{background:#7cfc9a;box-shadow:0 4px 0 #2a8a4a}
.go{color:#fff;background:linear-gradient(#ff7a4d,#d63a1a);box-shadow:0 4px 0 #7a1a10,inset 0 3px 0 rgba(255,255,255,.35);animation:gp 1.4s infinite}
@keyframes gp{50%{transform:scale(1.04)}}
.coin{display:inline-block;width:.6rem;height:.6rem;background:var(--y);border:2px solid #a07a00;border-radius:50%;margin-right:.25rem;vertical-align:baseline}
#wrap{position:fixed;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#07050f}
#stage{position:relative}
#stage canvas{position:absolute;left:0;top:0}
#hud{pointer-events:none}
#rot{display:none;position:fixed;inset:0;background:#0d0a1f;z-index:99;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:1rem}
#rot canvas{width:4rem;height:4rem;margin:0 auto .6rem;animation:rt 2s infinite}
@keyframes rt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait){#rot{display:flex}}
/* ---- меню ---- */
#menu{position:fixed;inset:0;display:none;flex-direction:column;background:#0d0a1f;z-index:9;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#menu::before{content:'';position:absolute;left:0;right:0;top:-120px;bottom:0;will-change:transform;background:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 80px,#9fe3ff,transparent),radial-gradient(1.5px 1.5px at 150px 20px,#ffd23f,transparent);background-size:180px 120px;animation:dr 14s linear infinite;opacity:.5;pointer-events:none}
@keyframes dr{to{transform:translateY(120px)}}
.top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.3rem .6rem;background:linear-gradient(#2c2060,#1b1340);border-bottom:3px solid #000;box-shadow:0 3px 0 #5b4aa8}
.ttl{white-space:nowrap;overflow:hidden;text-overflow:clip;min-width:0;font-size:var(--f2);color:var(--y);text-shadow:2px 2px #c0392b,4px 4px #000}
.badge{white-space:nowrap;background:#120d2a;border:3px solid #000;border-radius:14px;padding:.2rem .6rem;color:var(--y);min-width:4.5rem}
.tb{display:flex}
.ib{width:2.3rem;height:2.3rem;padding:.15rem;margin:0 0 0 .3rem;background:#5b4aa8;box-shadow:0 3px 0 #2a1f60;display:flex;align-items:center;justify-content:center}
.ib canvas{width:1.5rem;height:1.5rem}
.bd{position:relative;flex:1;display:flex;min-height:0}
#nav{position:relative;display:flex;flex-direction:column;width:calc(var(--f1)*8.8);flex:none;background:#120d2a;border-right:3px solid #000;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#nav button{position:relative;margin:0;border-radius:0;box-shadow:none;background:#1b1340;color:#b9b0e8;border:0;border-bottom:2px solid #000;padding:.3rem 0;font-size:var(--f1);white-space:nowrap;overflow-wrap:normal;flex:1;min-height:3.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem}
#nav button.on{background:var(--y);color:#1a1030}
#nav canvas{width:1.9rem;height:1.9rem}
#nav button.dot::after{content:'';position:absolute;top:6px;right:8px;width:9px;height:9px;background:#ff3b30;border:2px solid #000;border-radius:50%}
#mc{position:relative;flex:1;min-width:0}
.scr{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;padding:.5rem .7rem;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pn{background:linear-gradient(#2c2060,#1b1340);border:3px solid #000;box-shadow:inset 0 0 0 2px #5b4aa8,0 4px 0 #0008;border-radius:8px;padding:.5rem;margin:.4rem 0;text-align:center}
.split{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:.4rem;padding:.4rem}
.split>div{overflow-x:hidden;overflow-y:auto;padding:.3rem;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.gl{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;align-content:start}
.cd{overflow:hidden;overflow-wrap:anywhere;background:#241a4a;border:3px solid #000;box-shadow:inset 0 0 0 2px #5b4aa8;border-radius:6px;padding:.25rem;text-align:center;cursor:pointer;position:relative;font-size:var(--f1);line-height:1.2}
.cd canvas{width:100%;height:auto;aspect-ratio:64/56}
.cd.sel{box-shadow:inset 0 0 0 3px #7cfc9a}.cd.cur{box-shadow:inset 0 0 0 3px var(--y)}.cd.lk{opacity:.65}
.big{width:min(100%,11rem);height:auto;aspect-ratio:96/84;background:#140f2b;border:3px solid #5b4aa8;border-radius:6px;margin:.2rem auto}
.lg{display:flex;align-items:center;gap:.5rem;text-align:left;background:#120d2a;margin:.2rem 0;padding:.25rem .4rem;border-radius:4px;font-size:var(--f1);line-height:1.3}
.lg canvas{width:2rem;height:2rem;flex:none}
.lg.ult{box-shadow:inset 0 0 0 2px var(--y)}
.pips{display:flex;gap:.2rem;margin:.2rem 0}
.pips i{display:block;width:.62rem;height:.55rem;background:#000;border:2px solid #5b4aa8}.pips i.on{background:#7cfc9a;border-color:#000}
.bar{display:inline-block;width:6rem;height:.55rem;background:#000;border:2px solid #5b4aa8;vertical-align:middle}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4cd964,#ffd23f,#ff3b30)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:.5rem;text-align:left}
.sw{display:inline-block;width:1rem;height:1rem;border:2px solid #000;vertical-align:middle;margin-right:.3rem}
.mapcol{position:absolute;inset:0;display:flex;flex-direction:column}
#mapbox{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;position:relative;background:#0d0a1f;touch-action:pan-x;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#mapin{position:relative;display:inline-block;vertical-align:top}
#mapin canvas{cursor:pointer}
.al{position:absolute;top:.25rem;padding:.15rem .4rem;background:rgba(0,0,0,.7);border:2px solid #000;border-radius:4px;font-size:var(--f1);color:#fff;white-space:nowrap;pointer-events:none}
.al.lk{color:#888}
.info{display:flex;align-items:center;gap:.5rem;padding:.3rem .5rem;background:linear-gradient(#2c2060,#1b1340);border-top:3px solid #000;box-shadow:0 -3px 0 #5b4aa8}
.info canvas{width:4.2rem;height:auto;aspect-ratio:64/56;flex:none}
.im{flex:1;min-width:0;line-height:1.3;text-align:left}
.im canvas{width:1.5rem;height:1.5rem;display:inline-block;margin:.1rem .1rem 0 0}
.ib2{text-align:center;flex:none;font-size:var(--f1)}
#end{position:fixed;inset:0;display:none;overflow-x:hidden;overflow-y:auto;background:rgba(5,3,15,.9);padding:5vh .8rem;text-align:center;z-index:9;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#end .in{max-width:32rem;margin:auto}
.stars{display:flex;justify-content:center;gap:.4rem;margin:.3rem 0}.stars canvas{width:2.4rem;height:2.4rem}
/* ---- управление ---- */
#ctl{display:none;position:fixed;left:0;right:0;bottom:0;padding:0 max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:5}
#ctl.on.t{display:flex}
#joy,#ab{opacity:var(--bo,.5)}
#joy{position:relative;width:108px;height:108px;border-radius:50%;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.4);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(255,210,63,.7);border:3px solid rgba(0,0,0,.6)}
.ar{position:absolute;width:0;height:0;border:solid transparent}
.u{top:5px;left:calc(50% - 6px);border-width:0 6px 9px;border-bottom-color:#fffa}
.lf{left:5px;top:calc(50% - 6px);border-width:6px 9px 6px 0;border-right-color:#fffa}
.rt{right:5px;top:calc(50% - 6px);border-width:6px 0 6px 9px;border-left-color:#fffa}
#ab{display:grid;grid-template-columns:54px repeat(3,42px);grid-template-rows:repeat(2,42px);gap:4px}
#ab button{position:relative;overflow:hidden;pointer-events:auto;touch-action:none;margin:0;padding:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.45);box-shadow:none;font-size:var(--f1);line-height:1;display:flex;align-items:center;justify-content:center}
#ab button canvas{width:24px;height:24px;filter:drop-shadow(1px 1px 0 #000)}
#ab button::after{content:'';position:absolute;left:0;right:0;bottom:0;height:calc(var(--c,0)*100%);background:rgba(0,0,0,.5)}
#ab button em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:var(--f1);color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;z-index:2}
[data-a="3"]{grid-area:1/3;border-color:rgba(124,252,154,.8)!important}[data-a="4"]{grid-area:1/4;border-color:rgba(124,252,154,.8)!important}
[data-a="2"]{grid-area:2/2}[data-a="1"]{grid-area:2/3}[data-a="0"]{grid-area:2/4}
[data-a="5"]{grid-area:1/1/3/2;border-color:rgba(255,210,63,.75)!important;border-radius:14px}
[data-a="5"].rdy{background:rgba(255,120,40,.5)!important;border-color:#ffd23f!important;animation:ul .5s infinite}
@keyframes ul{50%{box-shadow:0 0 12px 3px #ffd23f}}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}
.ic2{width:2.4rem;height:2.4rem;flex:none}

@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
@keyframes starin{0%{transform:scale(0) rotate(-90deg);opacity:0}70%{transform:scale(1.3) rotate(10deg)}100%{transform:none;opacity:1}}
@keyframes rp{to{transform:scale(1);opacity:0}}
@keyframes tin{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
@keyframes bumpA{40%{transform:scale(1.18)}}
@keyframes nodot{50%{transform:scale(1.35)}}
#mc.anim>*{animation:fadein .22s both}
#mc.anim .pn,#mc.anim .cd{animation:pop .3s both}
.scr .pn:nth-child(2),.gl>.cd:nth-child(2),.split>div>.pn:nth-child(2){animation-delay:0.070s}
.scr .pn:nth-child(3),.gl>.cd:nth-child(3),.split>div>.pn:nth-child(3){animation-delay:0.105s}
.scr .pn:nth-child(4),.gl>.cd:nth-child(4),.split>div>.pn:nth-child(4){animation-delay:0.140s}
.scr .pn:nth-child(5),.gl>.cd:nth-child(5),.split>div>.pn:nth-child(5){animation-delay:0.175s}
.scr .pn:nth-child(6),.gl>.cd:nth-child(6),.split>div>.pn:nth-child(6){animation-delay:0.210s}
.scr .pn:nth-child(7),.gl>.cd:nth-child(7),.split>div>.pn:nth-child(7){animation-delay:0.245s}

function dqPick(t){let h=7;for(const ch of t)h=(h*31+ch.charCodeAt(0))>>>0;const r=()=>(h=(Math.imul(h,1103515245)+12345)>>>0)/4294967296,pool=DQP.slice(),out=[];while(out.length<3){const q=pool.splice(r()*pool.length|0,1)[0];if(out.some(o=>o[2]==q[2]))continue;out.push(q)}return out.map(o=>o[0])}
function dqInit(){const t=today();if(S.dq&&S.dq.d==t)return;S.dq={d:t,base:Object.assign({},S.s),cm:0,q:dqPick(t),done:[]};save()}

// ---------- рисование ----------
const R=(x,y,w,h,c)=>{C.fillStyle=c;C.fillRect(Math.round(x),Math.round(y),w,h)};
function circ(x,y,r,c){for(let j=-r;j<=r;j++){const w=Math.round(Math.sqrt(r*r-j*j+r*.5));R(x-w,y+j,2*w+1,1,c)}}
function ln(a,b,x,y,c){const n=Math.max(Math.abs(x-a),Math.abs(y-b),1);for(let i=0;i<=n;i++)R(a+(x-a)*i/n,b+(y-b)*i/n,1,1,c)}
const th=(a,b,x,y,c)=>{ln(a,b,x,y,c);ln(a,b+1,x,y+1,c)};

else if(x=='chest'){if(S.coins<CHEST){no('Не хватает монет');return}spend(CHEST);S.s.chest++;const n=1+(Math.random()<.35?1:0)+(Math.random()<.12?1:0),got={};for(let i=0;i<n;i++){const it=ITEMS[Math.random()*ITEMS.length|0];S.items[it[0]]=(S.items[it[0]]||0)+1;got[it[1]]=(got[it[1]]||0)+1}lastChest='Выпало: '+Object.entries(got).map(q=>q[0]+(q[1]>1?' x'+q[1]:'')).join(', ');ok(lastChest)}
else if(x=='skin'){const kk=SK[v];if(!S.sk.includes(+v)){if(S.coins<kk.p){no('Не хватает монет');return}spend(kk.p);S.sk.push(+v);ok('Скин куплен')}else sfx('click');if(+v==0)delete S.pal[S.ch];else S.pal[S.ch]={b:kk.b,a:kk.a,e:kk.e}}
else if(x=='rst'){delete S.pal[S.ch];sfx('click')}
else if(x=='brush'){if(S.brush||S.coins<BR){no('Не хватает монет');return}spend(BR);S.brush=true;ok('Кисть куплена')}
else if(x=='claim'){const g=GOALS.find(q=>q.id==v);if(!g||S.g.includes(g.id)||gval(g)<g.v)return;S.coins+=g.r;S.g.push(g.id);ok('Награда: +'+g.r)}
else if(x=='dclaim'){const d=dqDef(v);if(!d||S.dq.done.includes(v)||dqProg(d)<d[3])return;S.coins+=d[4];S.dq.done.push(v);ok('Награда: +'+d[4]);if(S.dq.done.length==3){S.s.dqd++;const it=ITEMS[Math.random()*ITEMS.length|0];S.items[it[0]]=(S.items[it[0]]||0)+1;setTimeout(()=>toast('Все задания! Предмет: '+it[1],'#ffd23f'),700)}}
else if(x=='tg'){if(k=='anm'){S.anm=S.anm===false;document.body.classList.toggle('noanim',S.anm===false)}else if(k=='mus'){S.mus=!S.mus;if(S.mus)music(wantMus);else{clearTimeout(mt);mus=-2}}else S[k]=S[k]===false;if(k=='snd'&&S.snd)sfx('click');else sfx('tick')}
else if(x=='set'){S[k]=+v;if(k=='bo'||k=='bsz'){applyBo();applyLayout()}if(k=='anm')document.body.classList.toggle('noanim',false);sfx('click')}
else if(x=='gset'){gset=v;sfx('tick')}
else if(x=='layout'){openEditor();return}
else if(x=='laysr'){S.lay={};ok('Расположение кнопок сброшено')}
else if(x=='tut'){S.pl=0;S.tut=true;ok('Подсказки включены заново')}
else if(x=='reset'){if(!rstT||Date.now()-rstT>4000){rstT=Date.now();sfx('no');toast('Нажми ещё раз, чтобы удалить всё','#ffd23f')}else{try{['bugfight8','bugfight7','bugfight6'].forEach(q=>localStorage.removeItem(q));location.reload()}catch(_){}return}}
else if(x=='snd'){S.snd=!S.snd;save();if(S.snd)sfx('click');menu();return}
else if(x=='mus'){S.mus=!S.mus;save();if(S.mus)music(wantMus);else{clearTimeout(mt);mus=-2}menu();return}
else if(x=='fs'){const d=document.documentElement;try{(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}catch(_){}return}
else if(x=='go'){if(S.sel>S.prog)return;S.tut=false;save();sfx('click');go('camp');return}
else if(x=='train'){save();sfx('click');go('train',false);return}
else if(x=='trainA'){save();sfx('click');go('train',true);return}
else if(x=='arena'){save();sfx('click');go('arena');return}

function menuAnim(){if(FR%7==0)document.querySelectorAll('#menu canvas[data-t]').forEach(c=>{if(c.dataset.s&&c._d)return;const r=c.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight||r.right<0||r.left>innerWidth)return;pv(c);c._d=1});if(tab=='map'&&FR%4==0)drawMap();
if(dispC>=0&&dispC!=S.coins&&FR%2==0){const d=S.coins-dispC;dispC+=Math.sign(d)*Math.max(1,Math.ceil(Math.abs(d)/7));if(Math.sign(S.coins-dispC)!=Math.sign(d))dispC=S.coins;const bb=$('#bdg');if(bb){bb.innerHTML=coin(dispC);bb.classList.add('bump')}if(FR%6==0)sfx('tick');if(dispC==S.coins)setTimeout(()=>{const b2=$('#bdg');if(b2)b2.classList.remove('bump')},300)}}

let last=0,acc=0;

while(acc>=16.67){acc-=16.67;if(mode=='online'&&NET.on&&st!='menu'){netFrame();continue}if(st!='menu'&&!paused){fxUpd();if(st!='over'){if(hs>0)hs--;else if(slow>0&&(slow--&1)){}else tick()}}}

['pointerdown','touchstart','keydown','click','wheel'].forEach(ev=>addEventListener(ev,unlockA,{passive:true}));
